# The terminal core (CortaTerminal) has no third-party dependencies. The
# app shell has exactly one — Sparkle, for update checks — plus the
# GitHub Actions used by CI, both tracked here.
#
# Every CI run holds four macOS runners (two test jobs, the Swift and C/C++
# CodeQL scans), and main requires a PR to be up to date before it merges,
# so each separate bump re-runs CI once per merge ahead of it. Grouping the
# Actions bumps into one PR pays for that once. Security updates stay in a
# group of their own so a fix never waits on a routine version bump.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: swift
    directory: "/"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"
