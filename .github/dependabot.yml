# The terminal core (CortaTerminal) has no third-party dependencies. The
# app shell has exactly one — Sparkle, for update checks — plus the
# GitHub Actions used by CI, both tracked here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"

  - package-ecosystem: swift
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "build"
