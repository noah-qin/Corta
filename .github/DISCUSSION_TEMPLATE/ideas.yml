body:
- type: markdown
  attributes:
    value: |-
      Use Ideas for thoughts that are not yet concrete requests, or preferences about appearance and layout.
      When an idea becomes concrete and respects settled decisions, the maintainer turns it into an issue.
      Transparency, ligatures and per-profile settings are not shipped; each needs a decision in [docs/DECISIONS.md](https://github.com/noah-qin/Corta/blob/main/docs/DECISIONS.md) first.
      English preferred; Chinese and Japanese are welcome too.
- type: checkboxes
  id: decisions
  attributes:
    label: Before suggesting an idea
    options:
    - label: I have read the non-goals in `docs/DESIGN.md` §6 and the settled decisions in `docs/DECISIONS.md`.
      required: true
- type: textarea
  id: problem
  attributes:
    label: The problem or workflow
  validations:
    required: true
- type: textarea
  id: idea
  attributes:
    label: The idea
  validations:
    required: true
- type: dropdown
  id: settled
  attributes:
    label: Does it touch a settled decision?
    options:
    - 'No'
    - Yes — I explain the new reason below
    - Not sure
    description: If yes, explain the new reason in The idea above.
- type: textarea
  id: other-terminals
  attributes:
    label: How other terminals do it
