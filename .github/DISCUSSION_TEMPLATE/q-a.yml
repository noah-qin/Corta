body:
- type: markdown
  attributes:
    value: |-
      Ask about using Corta here. For a reproducible bug, use the [bug form](https://github.com/noah-qin/Corta/issues/new?template=bug_report.yml).
      Report security problems through the [private channel in SECURITY.md](https://github.com/noah-qin/Corta/blob/main/SECURITY.md).
      Before asking, check the [User guide](https://github.com/noah-qin/Corta/blob/main/docs/USER-GUIDE.md), [Configuration](https://github.com/noah-qin/Corta/blob/main/docs/CONFIGURATION.md) and [Troubleshooting](https://github.com/noah-qin/Corta/blob/main/docs/TROUBLESHOOTING.md).
      English preferred; Chinese and Japanese are welcome too.
- type: textarea
  id: question
  attributes:
    label: Question
  validations:
    required: true
- type: textarea
  id: tried
  attributes:
    label: What you tried
- type: input
  id: version
  attributes:
    label: Corta version
    description: Find this in Corta → About Corta.
    placeholder: 1.1.8
  validations:
    required: true
- type: input
  id: mac
  attributes:
    label: macOS version and Mac
    placeholder: macOS 26.5, MacBook Air M3
  validations:
    required: true
- type: input
  id: shell
  attributes:
    label: Shell and the program involved
    placeholder: zsh 5.9, Claude Code in tmux over ssh
- type: textarea
  id: config
  attributes:
    label: Relevant config lines
    description: The config file is ~/.config/corta/config; Settings edits the same file. Paste only
      relevant lines and remove hostnames and tokens.
    render: ini
