# The one place a workflow picks its toolchain. The release is named by
# `.xcode-version` at the repository root, so every workflow moves together:
# changing that file is changing the toolchain the shipped binary is built with.
name: Select the pinned Xcode
description: Points the job at the Xcode release `.xcode-version` names, or fails when the runner image lacks it.
inputs:
  scope:
    description: "`system` runs xcode-select for the whole runner; `job` sets DEVELOPER_DIR for this job's later steps only."
    default: system
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SCOPE: ${{ inputs.scope }}
      run: |
        pin=$(tr -d '[:space:]' < .xcode-version)
        pinned="/Applications/Xcode_${pin}.app"
        if [ ! -d "$pinned" ]; then
          echo "::error::$pinned is not on this runner image."
          echo "Installed: $(ls -d /Applications/Xcode*.app | tr '\n' ' ')"
          echo "Change .xcode-version deliberately, or restore the image."
          exit 1
        fi
        if [ "$SCOPE" = job ]; then
          echo "DEVELOPER_DIR=$pinned/Contents/Developer" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$pinned/Contents/Developer"
        else
          sudo xcode-select -s "$pinned"
        fi
        xcodebuild -version
        xcrun swift --version
