name: CI

# PRs validate source; main pushes update CodeQL baselines without repeating
# app/core tests, and only for languages whose analysed inputs changed since
# main's last analysis of them. A PR uploads that analysis for a language it
# leaves unchanged. Metadata edits have a separate, read-only title workflow.

# Verified 2026-09-05: both the macos-26 runner label and ad-hoc signing of
# the test host work on a hosted runner (workflow_dispatch run 33895022048,
# noah-qin/Corta#8) — both jobs passed clean on the first try. The branch
# ruleset already names both jobs as required checks; automatic triggers on
# now so a PR's checks actually populate instead of sitting unfulfilled.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Full checks, or affected checks against current main (update-feed PR)
        type: choice
        options: [full, changed]
        default: full
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only is all either job needs. Without this the workflow inherits the
# repository default, which is broader than a build has any use for.
permissions:
  contents: read

env:
  # Stable releases only. Keep this pin aligned with nightly.yml so
  # runner image updates cannot silently change the compiler under a PR.
  # If the pinned release disappears, deliberately update both workflows.
  XCODE_PIN: "26.6.0"


jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Reads main's CodeQL analyses to decide which languages can reuse one.
    permissions:
      contents: read
      security-events: read
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
      core: ${{ steps.changes.outputs.core }}
      app: ${{ steps.changes.outputs.app }}
      feed: ${{ steps.changes.outputs.feed }}
      ssh: ${{ steps.changes.outputs.ssh }}
      fuzz: ${{ steps.changes.outputs.fuzz }}
      languages: ${{ steps.changes.outputs.languages }}
      codeql_baselines: ${{ steps.changes.outputs.codeql_baselines }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history avoids truncated file lists and supports PR merge bases.
          fetch-depth: 0
      - name: Select checks for the complete diff
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/ci-docs-only.py
      - name: Check local documentation links
        if: github.event_name != 'push'
        run: python3 -B scripts/check-doc-links.py
      - name: Check change detection and documentation checker
        if: github.event_name != 'push'
        run: python3 -B -m unittest discover -s scripts/tests -v

  codeql:
    name: Code scanning
    needs: changes
    with:
      languages: ${{ needs.changes.outputs.languages || '["swift","c-cpp","python","actions"]' }}
      baselines: ${{ needs.changes.outputs.codeql_baselines || '{}' }}
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write

  dependency-review:
    name: Dependency review
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Explicit refs also cover workflow_dispatch on bot-created PRs.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ github.event.pull_request.base.sha || 'main' }}
          head-ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          license-check: false
          comment-summary-in-pr: never

  pr-title:
    name: Pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the squash-merge subject
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 -B scripts/check-pr-title.py

  core:
    name: Terminal core (SwiftPM)
    needs: changes
    # Always retain the repository license check; compile/test the core only when affected.
    if: ${{ !cancelled() && github.event_name != 'push' }}
    runs-on: macos-26
    # A hung test otherwise holds a runner for the six-hour default.
    timeout-minutes: 30
    steps:
      - name: Require successful lightweight checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGES_RESULT" = success

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select the pinned Xcode
        run: |
          pinned="/Applications/Xcode_${XCODE_PIN}.app"
          if [ ! -d "$pinned" ]; then
            echo "::error::$pinned is not on this runner image."
            echo "Installed: $(ls -d /Applications/Xcode*.app | tr '\n' ' ')"
            echo "Bump XCODE_PIN in this workflow deliberately, or restore the image."
            exit 1
          fi
          sudo xcode-select -s "$pinned"
          xcodebuild -version
          swift --version

      - name: Check repository license headers
        run: swift run --package-path CortaTerminal corta-license check

      - name: Build
        if: needs.changes.outputs.core == 'true'
        run: swift build --package-path CortaTerminal -c release

      # #129 taught the SFTP rig's deadlines to scale with this, for the
      # nightly sanitizer lane — and nothing set it here, so on the lane
      # that actually goes red it stayed 1 and the deadlines were exactly
      # what they had been before the fix. #128 recurred on an ordinary CI
      # run for that reason. `swift test` runs in-process, so the variable
      # reaches the tests directly; the app job needs the TEST_RUNNER_
      # prefix because its tests live inside a separate host.
      - name: Test
        if: needs.changes.outputs.core == 'true'
        env:
          CORTA_TEST_TIMEOUT_SCALE: "3"
        # Swift Testing runs suites concurrently by default. On a hosted VM,
        # hundreds of tests contend with real PTY children and SFTP fixtures:
        # a fixture's blocking wait may expire before its test resumes.
        # Serialize suites here; tests still exercise their own concurrent
        # readers/transfers, and the nightly sanitizer lane remains parallel.
        run: swift test --package-path CortaTerminal --no-parallel

      # The step above skips the real-OpenSSH suite: it needs an sshd. This
      # one starts a throwaway sshd on 127.0.0.1 with its own keys and config
      # in a temporary directory, runs `SFTPSSHIntegrationTests` against it,
      # and removes all of it. Nothing else exercised authentication and
      # host-key failure against real ssh on every change.
      - name: Real SSH and SFTP against an isolated sshd
        if: needs.changes.outputs.ssh == 'true'
        run: python3 -B script/verify_ssh_integration.py

      # One corpus per target: the raw feed, OSC and Kitty payloads framed
      # as their sequences, and SFTP frames from a hostile server.
      - name: Replay the fuzz corpus
        if: needs.changes.outputs.fuzz == 'true'
        run: |
          fuzz=CortaTerminal/.build/release/corta-fuzz
          $fuzz CortaTerminal/Tests/Fuzz/corpus/*
          for target in osc kitty sftp; do
            $fuzz --target "$target" CortaTerminal/Tests/Fuzz/"$target"/*
          done

      # Seed 1 on a PR, deliberately: a PR check has to be a regression
      # check, and a different seed every run means a failure a reviewer
      # cannot reproduce. Rotating seeds are the nightly lane's job.
      - name: Short mutation fuzz run
        if: needs.changes.outputs.fuzz == 'true'
        run: |
          fuzz=CortaTerminal/.build/release/corta-fuzz
          $fuzz --fuzz 200000 --seed 1 CortaTerminal/Tests/Fuzz/corpus
          for target in osc kitty sftp; do
            $fuzz --target "$target" --fuzz 100000 --seed 1 CortaTerminal/Tests/Fuzz/"$target"
          done

      - name: Keep the crashing input when the fuzzer finds one
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failure-core
          path: |
            CortaTerminal/Tests/Fuzz
            /tmp/corta-fuzz-*
          if-no-files-found: ignore
          retention-days: 14

  app:
    # The name covers the update-feed check too, because a required status
    # check reports under its job's name and nothing else: with the feed
    # riding in a job called "App and tests", a malformed `appcast.xml`
    # showed up on a pull request as an app-test failure, which is the
    # wrong thing to tell someone at the moment they need to know what
    # broke. Renaming a job renames the required check, so the branch
    # ruleset has to be updated in the same sitting or every pull request
    # waits for a check that will never report again.
    name: App, tests and the update feed
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'push' && (needs.changes.result != 'success' || needs.changes.outputs.app == 'true' || needs.changes.outputs.feed == 'true') }}
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Require successful lightweight checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
        run: test "$CHANGES_RESULT" = success

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select the pinned Xcode
        run: |
          pinned="/Applications/Xcode_${XCODE_PIN}.app"
          if [ ! -d "$pinned" ]; then
            echo "::error::$pinned is not on this runner image."
            echo "Installed: $(ls -d /Applications/Xcode*.app | tr '\n' ' ')"
            echo "Bump XCODE_PIN in this workflow deliberately, or restore the image."
            exit 1
          fi
          sudo xcode-select -s "$pinned"
          xcodebuild -version

      # Metal 4 is the only renderer (#109), and it needs
      # `MTLGPUFamily.metal4`. This runner is a virtual machine on Apple
      # silicon, and its paravirtualised GPU reports only `apple5` — so no
      # pane can render here, and every suite that renders or needs a working
      # pane is skipped (docs/TESTING.md). Printed before the build, so
      # the value is in the log even when the tests fail.
      - name: Report the runner's Metal capability
        if: needs.changes.outputs.app == 'true'
        run: swift scripts/metal-capability.swift

      # `appcast.xml` on `main` *is* the live update feed — `SUFeedURL`
      # points straight at it — so anything merged here is served to every
      # running Corta immediately. `corta-release-check --appcast` only ever
      # ran at release time, against the one version being released; a hand
      # edit, a bad merge or a corrupted older entry had nothing looking at
      # it. This is the offline half of that invariant: structure, the
      # enclosure URL each item must carry for its own version, build
      # numbers unique and ordered, key and signatures well-formed. No
      # network, no build, about two seconds — which is why it rides in this
      # job rather than spinning a runner of its own. The half that needs
      # the archives themselves runs nightly.
      - name: Check the update feed (offline)
        run: swift scripts/verify-appcast.swift

      # The runner has no signing identity and no access to the maintainer's
      # team, so build ad-hoc signed. The unit tests host inside the app, so
      # signing cannot be switched off entirely — only made local.
      # Reaches the test host as CORTA_TEST_TIMEOUT_SCALE (xcodebuild strips
      # the prefix). The app suite waits on real child processes, a reader
      # loop observing an exit, a debounced sweep settling — latencies that
      # belong to the machine. Their ceilings are written so that reaching
      # one means something is wrong, which stops being true on a saturated
      # runner. A ceiling only costs time when it is reached, so a healthy
      # run is no slower, and a local run keeps the written number.
      - name: Check signed update-feed fixtures
        run: python3 -B -m unittest discover -s scripts/tests -p test_appcast_formats.py -v

      - name: Build and test
        id: tests
        if: needs.changes.outputs.app == 'true'
        env:
          TEST_RUNNER_CORTA_TEST_TIMEOUT_SCALE: "3"
        run: |
          xcodebuild test \
            -project Corta.xcodeproj \
            -scheme Corta \
            -destination 'platform=macOS' \
            -testPlan Unit \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            -resultBundlePath TestResults.xcresult \
            -quiet

      # `-quiet` hides every per-test line, so a green run says nothing about
      # what it skipped. On this runner every rendering suite skips — the
      # capability step above says why — and they used to do so invisibly.
      # Printing the counts is what keeps "passed" and "never ran" apart in
      # a log nobody downloads the result bundle for.
      - name: Summarise the test run
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        run: |
          # Without pipefail the step's status is jq's: xcresulttool failing
          # (no bundle, a renamed key, a future Xcode) would leave the step
          # green with no `tests:` line — the one thing keeping "passed" and
          # "never ran" apart, gone, silently. That is the failure class
          # this whole gate exists to remove.
          set -o pipefail
          xcrun xcresulttool get test-results summary \
            --path TestResults.xcresult --format json \
            | jq -r '"tests: total=\(.totalTestCount) passed=\(.passedTests) failed=\(.failedTests) skipped=\(.skippedTests) expected-failures=\(.expectedFailures)"'

      # Without the bundle a failed run is a scrolled-off log line. With it
      # the failing test, its message and its attachments come back.
      - name: Keep the test results when something fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcresult-app
          path: TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 14

  # UI tests need a real window server session and are not run on every PR.
  # `docs/CONFORMANCE.md` §4.4 is explicit that the app-layer check is a
  # human launching the app — CI does not replace it.
