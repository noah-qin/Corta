name: Update feed

# Called by Release after publication, and manually for recovery/rehearsal.
# Uses the release tag's code and metadata but carries over the latest feed
# from main. The signing key remains an environment secret piped to stdin.
# Publishing the feed still uses a PR and explicitly dispatched CI.

on:
  workflow_call:
    inputs:
      tag:
        description: Published release tag
        type: string
        required: true
      dry_run:
        type: boolean
        default: false
  # For a re-run after a failure, or a rehearsal: `dry_run` stops after
  # the sign job has signed and checked the feed, so nothing is pushed.
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to sign (e.g. v1.0.0)
        required: true
      dry_run:
        description: Sign and check only; open no pull request
        type: boolean
        default: false

# Also serializes manual recovery with the automatic feed call. This group
# must differ from the caller's corta-release group to avoid a deadlock.
concurrency:
  group: corta-update-feed
  cancel-in-progress: false

permissions:
  contents: read

env:
  SPARKLE_VERSION: "2.10.0"
  # `shasum -a 256 Sparkle-2.10.0.tar.xz` from the sparkle-project/Sparkle
  # release of that version, recorded 2026-09-27. Package.resolved pins
  # the same version for the app; bump both together.
  SPARKLE_TARBALL_SHA256: "c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c"

jobs:
  sign:
    name: Sign the archive into the feed
    runs-on: macos-26
    timeout-minutes: 20
    environment: release
    # A pre-release is a build a person chose not to offer everyone; the
    # feed offers everyone.
    if: ${{ github.repository == 'noah-qin/Corta' && github.ref == 'refs/heads/main' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      changed: ${{ steps.sign.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Work out the version
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          tag="$TAG"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Expected a stable vX.Y.Z release tag"; exit 1;
          }
          test "$(git rev-parse "refs/tags/$tag^{commit}")" = "$(git rev-parse HEAD)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Download the published archive and its checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.version.outputs.tag }}" --json isDraft,isPrerelease \
            --jq 'if (.isDraft or .isPrerelease) then error("The feed requires a published stable release") else "Published stable release" end'
          mkdir -p feed
          gh release download "${{ steps.version.outputs.tag }}" \
            --pattern "Corta-${{ steps.version.outputs.version }}.zip*" \
            --dir feed
          cd feed
          shasum -a 256 -c "Corta-${{ steps.version.outputs.version }}.zip.sha256"

      - name: Fetch Sparkle's signing tools
        run: |
          curl -sSL --fail -o sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          echo "${SPARKLE_TARBALL_SHA256}  sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p sparkle
          tar -xJf sparkle.tar.xz -C sparkle ./bin/generate_appcast
          test -x sparkle/bin/generate_appcast

      - name: Carry over the latest update feed
        run: |
          git fetch origin main
          git show origin/main:appcast.xml > appcast.xml
          cp appcast.xml "$RUNNER_TEMP/original-appcast.xml"

      # A rerun of an already published feed verifies its existing item;
      # it never regenerates dates or signatures and never replaces bytes.
      - name: Sign the archive into appcast.xml
        id: sign
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          exists=$(python3 - <<'PYTHON'
          import os
          import xml.etree.ElementTree as ET
          ns = '{http://www.andymatuschak.org/xml-namespaces/sparkle}'
          print('true' if any(n.text == os.environ['VERSION']
                for n in ET.parse('appcast.xml').iter(ns + 'shortVersionString')) else 'false')
          PYTHON
          )
          if [ "$exists" != true ]; then
            test -n "$SPARKLE_PRIVATE_KEY" || { echo "::error::SPARKLE_PRIVATE_KEY is empty"; exit 1; }
            cp appcast.xml feed/appcast.xml
            printf '%s\n' "$SPARKLE_PRIVATE_KEY" | sparkle/bin/generate_appcast \
              --ed-key-file - \
              --download-url-prefix "https://github.com/noah-qin/Corta/releases/download/$TAG/" \
              feed
            cp feed/appcast.xml appcast.xml
          fi
          if cmp -s appcast.xml "$RUNNER_TEMP/original-appcast.xml"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      # The release check, against the unpacked archive:
      # the item's build, URL, length and signature agree with the app the
      # release actually shipped, and that app is Developer ID signed,
      # stapled and accepted by Gatekeeper.
      - name: Check the app, the archive and the feed agree
        run: |
          mkdir -p unpacked
          ditto -x -k "feed/Corta-${{ steps.version.outputs.version }}.zip" unpacked
          swift run --package-path CortaTerminal -c release corta-release-check \
            check unpacked/Corta.app \
            --version "${{ steps.version.outputs.version }}" \
            --archive "feed/Corta-${{ steps.version.outputs.version }}.zip" \
            --appcast --require-notarized

      - name: Hand the signed feed to the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appcast-${{ steps.version.outputs.tag }}
          path: appcast.xml
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Merge the feed to main
    needs: sign
    if: ${{ !inputs.dry_run && needs.sign.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      actions: write
      # report-ci-statuses.sh: the dispatched CI's result, as the PR's checks.
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: appcast-v${{ needs.sign.outputs.version }}

      - name: Open the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.sign.outputs.version }}"
          branch="chore/appcast-v${version}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add appcast.xml
          if git diff --cached --quiet; then
            echo "::error::The feed changed while signing; rerun to verify the latest feed."
            exit 1
          fi
          git commit -m "chore: publish ${version} to the update feed" -m \
            "Verified against the published archive by corta-release-check --appcast --require-notarized."
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch origin "$branch"
            test "$(git diff --stat HEAD FETCH_HEAD -- appcast.xml)" = "" || {
              echo "::error::Existing feed branch differs; inspect it before retrying."; exit 1;
            }
            git reset --hard FETCH_HEAD
          else
            git push -u origin "$branch"
          fi
          url=$(gh pr list --head "$branch" --base main --state open --json url --jq '.[0].url // empty')
          if [ -z "$url" ]; then
            cat > "$RUNNER_TEMP/feed-pr.md" <<'BODY'
          Updates the signed Sparkle feed from the published release. The archive checksum, Developer ID signature, Apple notarisation and feed signature have been verified by corta-release-check. CI must pass before this PR merges.
          BODY
            url=$(gh pr create --base main --head "$branch" \
              --title "chore: publish ${version} to the update feed" \
              --body-file "$RUNNER_TEMP/feed-pr.md")
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run CI on the branch and wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="${{ steps.pr.outputs.branch }}"
          started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          expected="${{ steps.pr.outputs.head }}"
          gh workflow run ci.yml --ref "$branch"
          # The dispatch is asynchronous; give the run a moment to exist.
          for _ in $(seq 1 12); do
            run_id=$(gh run list --workflow ci.yml --branch "$branch" --event workflow_dispatch \
              --limit 20 --json databaseId,headSha,createdAt \
              --jq ".[] | select(.headSha == \"$expected\" and .createdAt >= \"$started\") | .databaseId" | head -1)
            [ -n "$run_id" ] && break
            sleep 5
          done
          test -n "$run_id" || { echo "::error::CI did not start on $branch"; exit 1; }
          echo "CI run $run_id on $branch"
          gh run watch "$run_id" --exit-status --interval 30
          bash scripts/report-ci-statuses.sh "$run_id" "$expected"

      - name: Squash-merge or enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr view "${{ steps.pr.outputs.url }}" \
            --json number,url,mergeable,mergeStateStatus
          gh pr merge "${{ steps.pr.outputs.url }}" --squash --auto --delete-branch \
            --subject "chore: publish ${{ needs.sign.outputs.version }} to the update feed" \
            --match-head-commit "${{ steps.pr.outputs.head }}" \
            --body "Signed from the published v${{ needs.sign.outputs.version }} release by the update-feed workflow (D20)."
          # Keep the caller's release lock until this update is actually live.
          for _ in $(seq 1 120); do
            state=$(gh pr view "${{ steps.pr.outputs.url }}" --json state --jq .state)
            [ "$state" != MERGED ] || break
            [ "$state" != CLOSED ] || { echo '::error::Feed PR was closed.'; exit 1; }
            sleep 10
          done
          test "$state" = MERGED || { echo '::error::Feed PR is still awaiting merge; rerun after resolving its checks.'; exit 1; }
