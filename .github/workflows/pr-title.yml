name: Pull request metadata

on:
  pull_request:
    types: [edited]
permissions:
  contents: read
concurrency:
  group: pr-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  pr-title:
    name: Pull request title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the squash-merge subject
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 -B scripts/check-pr-title.py
      - name: Require source validation when the PR base changes
        if: github.event.changes.base
        run: |
          echo "::error::The PR base changed. Reopen the PR or push a commit to run source CI against its new merge base."
          exit 1
