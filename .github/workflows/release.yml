name: Release

# Cutting a release: follow the checklist in docs/RELEASING.md,
# then push a tag. This builds from the tag and opens a DRAFT release for
# review — nothing is ever published automatically. Once a person
# publishes the draft, `appcast.yml` signs it into the update feed (D20).
#
# Signing and notarisation run only when the `release` environment
# carries all five values below. Without them — a fork, or a repository
# that has not set them up — the workflow still produces an ad-hoc signed
# build, and the release notes say so plainly rather than handing users a
# download that Gatekeeper will silently refuse.
#
#   DEVELOPER_ID_P12           secret   Developer ID Application .p12, base64
#   DEVELOPER_ID_P12_PASSWORD  secret   its password
#   ASC_KEY                    secret   App Store Connect team API key (.p8)
#   ASC_KEY_ID                 variable that key's Key ID
#   ASC_ISSUER_ID              variable the team's Issuer ID
#
# The certificate signs and the API key notarises. The key cannot sign:
# cloud-managed Developer ID signing is refused to API keys whatever their
# role ("Cloud signing permission error", #134), and a hosted runner cannot
# sign in to an Xcode account, so the certificate has to reach the runner.
# It lives in a throwaway keychain for the length of the job.
#
# The job runs in the `release` environment, so a build that can reach
# either secret waits for the maintainer's approval and runs only from a
# `v*` tag — the same gate the Sparkle key sits behind (D20). Rotating
# either is in docs/RELEASING.md.

on:
  push:
    tags: ["v*"]
  # A re-run of an existing tag, or a rehearsal. `dry_run` builds, signs,
  # notarises and checks the dispatched ref at the version its project
  # carries, keeps the archive as a workflow artifact, and drafts no
  # release. The ref must be one the `release` environment allows; see
  # docs/RELEASING.md.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (e.g. v1.1.0); ignored by a dry run
        required: false
      dry_run:
        description: Sign, notarise and check only; draft no release
        type: boolean
        default: false

permissions:
  contents: write

env:
  # The shipping artifact is the one place the toolchain matters most; see
  # the same pin in `ci.yml`.
  XCODE_PIN: "26.6.0"

jobs:
  release:
    name: Build and draft a release
    runs-on: macos-26
    timeout-minutes: 90
    environment: release

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.dry_run && github.ref || inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Select the pinned Xcode
        run: |
          pinned="/Applications/Xcode_${XCODE_PIN}.app"
          if [ ! -d "$pinned" ]; then
            echo "::error::$pinned is not on this runner image."
            echo "Installed: $(ls -d /Applications/Xcode*.app | tr '\n' ' ')"
            echo "A release builds on the pinned toolchain or not at all."
            exit 1
          fi
          sudo xcode-select -s "$pinned"
          xcodebuild -version

      - name: Work out the version
        id: version
        # A dry run has no tag to read, so it takes the version the
        # project carries — the one `corta-release-check` holds the
        # CHANGELOG and README to.
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            versions=$(sed -n 's/.*MARKETING_VERSION = \(.*\);/\1/p' \
              Corta.xcodeproj/project.pbxproj | sort -u)
            if [ "$(echo "$versions" | wc -l)" -ne 1 ]; then
              echo "::error::project.pbxproj carries more than one MARKETING_VERSION: $versions"
              exit 1
            fi
            tag="v$versions"
          elif [ -n "$TAG_INPUT" ]; then
            tag="$TAG_INPUT"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            echo "::error::Name a tag to build, or ask for a dry run."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # None of the five is a fork: build ad hoc. All five: sign. Anything
      # in between is a misconfigured environment — an emptied secret reads
      # exactly like a missing one — and would otherwise ship an unsigned
      # draft without a word, so it fails and names what is missing. A dry
      # run exists to rehearse signing, so it never falls back to ad hoc.
      - name: Check whether signing secrets are available
        id: signing
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_KEY: ${{ secrets.ASC_KEY }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
        run: |
          missing=""
          [ -n "$P12" ] || missing="$missing DEVELOPER_ID_P12"
          [ -n "$P12_PASSWORD" ] || missing="$missing DEVELOPER_ID_P12_PASSWORD"
          [ -n "$ASC_KEY" ] || missing="$missing ASC_KEY"
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          count=$(echo $missing | wc -w | tr -d ' ')
          if [ "$count" -eq 0 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "$count" -eq 5 ] && [ "$DRY_RUN" != "true" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing secrets. Producing an ad-hoc signed, un-notarised build."
          else
            echo "::error::The release environment is missing or has emptied:$missing"
            exit 1
          fi

      - name: Run the tests before shipping anything
        env:
          # The core suite reads this directly (`swift test` is in-process);
          # the app suite needs the prefix, which xcodebuild strips on the
          # way into the test host.
          CORTA_TEST_TIMEOUT_SCALE: "3"
          TEST_RUNNER_CORTA_TEST_TIMEOUT_SCALE: "3"
        run: |
          swift test --package-path CortaTerminal
          xcodebuild test \
            -project Corta.xcodeproj \
            -scheme Corta \
            -destination 'platform=macOS' \
            -testPlan Unit \
            -resultBundlePath test-results.xcresult \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            -quiet

      # Kept whether or not the tests passed. A draft release is reviewed by
      # a person before it is published, and "the tests passed" is a claim
      # that review should be able to check rather than take on faith — the
      # bundle is the evidence. On a failure it is the only record of what
      # went wrong, since the run stops here.
      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xcresult-release-${{ steps.version.outputs.tag }}
          path: test-results.xcresult
          if-no-files-found: warn
          retention-days: 90

      # -quiet above hides the individual #expect failure message (which
      # menu items collided, here) — only the test name survives to the
      # log. Print it from the result bundle so a failure is diagnosable
      # without re-running locally, which has not reproduced this at all
      # (docs/readme-build-step and v0.1.0 both failed
      # MenuShortcutTests.noKeystrokeIsClaimedByTwoMenuItems on this
      # runner; a dozen local attempts across two machines have not).
      - name: Print test failure details
        if: failure()
        run: |
          # 'Failure Message' is a *child node type* here, not a field on
          # the failing test — confirmed against this schema locally
          # before relying on it in CI (`xcresulttool ... --schema`).
          xcrun xcresulttool get test-results tests \
            --path test-results.xcresult --compact | \
            jq -r '
              def failures($under):
                (if .nodeType == "Failure Message" then "\($under): \(.name)" else empty end),
                ((if .nodeType == "Test Case" then .name else $under end) as $label
                  | (.children // [])[] | failures($label));
              (.testNodes // [])[] | failures(null)'

      # `xcodebuild build` is a development action: it left the
      # com.apple.security.get-task-allow entitlement on Corta and
      # corta-exec, and re-signed Sparkle.framework's own nested helpers
      # (Autoupdate, Updater.app, the two XPC services) without a secure
      # timestamp — both are things notarization rejects outright, and a
      # plain `build` does not go through the same "prepare for
      # distribution" pipeline `archive` + `-exportArchive` does, which
      # is what actually fixes them rather than working around either
      # symptom by hand.
      #
      # `ARCHS=arm64` on the command line, not only in project.pbxproj:
      # Xcode does not apply a project's ARCHS to Swift package products,
      # so corta-exec came out universal while the app was arm64 (D21). A
      # command-line setting reaches every target. corta-release-check fails a
      # build where either executable carries another slice.
      - name: Import the signing certificate
        if: steps.signing.outputs.available == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          certificate="$RUNNER_TEMP/certificate.p12"
          trap 'rm -f "$certificate"' EXIT
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          (umask 077 && printf '%s' "$P12" | base64 --decode > "$certificate")
          security import "$certificate" -k "$keychain" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain" > /dev/null

      # The identity is named by its kind and the team rather than stored
      # as a secret: the keychain holds exactly one Developer ID
      # Application certificate, so the name is unambiguous.
      - name: Build (signed)
        if: steps.signing.outputs.available == 'true'
        run: |
          options="$RUNNER_TEMP/ExportOptions.plist"
          trap 'rm -f "$options"' EXIT

          xcodebuild archive \
            -project Corta.xcodeproj \
            -scheme Corta \
            -configuration Release \
            -archivePath build/Corta.xcarchive \
            ARCHS=arm64 \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=646VSJ9K5F \
            ENABLE_HARDENED_RUNTIME=YES \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime" \
            -quiet

          cat > "$options" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>teamID</key>
            <string>646VSJ9K5F</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Developer ID Application</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath build/Corta.xcarchive \
            -exportPath build/Build/Products/Release \
            -exportOptionsPlist "$options" \
            -quiet

      - name: Build (ad-hoc)
        if: steps.signing.outputs.available != 'true'
        run: |
          xcodebuild build \
            -project Corta.xcodeproj \
            -scheme Corta \
            -configuration Release \
            -derivedDataPath build \
            ARCHS=arm64 \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            -quiet

      # A rehearsal rebuilds a version the feed usually already publishes
      # (the project carries the last release's version until the next is
      # cut), and the check rightly refuses to package a published version.
      # So a dry run sets that item aside in the runner's copy of the feed;
      # nothing it changes is committed or pushed.
      - name: Set the published feed item aside (dry run)
        if: inputs.dry_run
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          swift - <<'SWIFT'
          import Foundation
          let version = ProcessInfo.processInfo.environment["VERSION"]!
          let url = URL(fileURLWithPath: "appcast.xml")
          let feed = try XMLDocument(contentsOf: url, options: [.nodePreserveAll])
          let items = try feed.nodes(forXPath:
              "//item[*[local-name()='shortVersionString' and normalize-space()='\(version)']]")
          items.forEach { $0.detach() }
          try feed.xmlData(options: [.nodePreserveAll]).write(to: url)
          print("set aside \(items.count) item(s) for \(version)")
          SWIFT

      # The same command a maintainer runs locally (`corta-release-check
      # package`): the archive, its SHA-256 sidecar, then the release check —
      # versions, build number, deployment target, CHANGELOG/README
      # agreement, architecture, signature, archive and sidecar. One
      # implementation of the rules, so the two routes reject the same
      # artifact (B15).
      - name: Package and check
        id: package
        run: |
          app=build/Build/Products/Release/Corta.app
          test -d "$app" || { echo "no app at $app"; exit 1; }
          zip="Corta-${{ steps.version.outputs.version }}.zip"
          swift run --package-path CortaTerminal -c release corta-release-check \
            package "$app" "${{ steps.version.outputs.version }}" .
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Notarise and staple
        if: steps.signing.outputs.available == 'true'
        env:
          ASC_KEY: ${{ secrets.ASC_KEY }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
        run: |
          key="$RUNNER_TEMP/asc-key.p8"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$ASC_KEY" > "$key")
          xcrun notarytool submit "${{ steps.package.outputs.zip }}" \
            --key "$key" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait
          xcrun stapler staple build/Build/Products/Release/Corta.app
          xcrun stapler validate build/Build/Products/Release/Corta.app
          codesign --verify --deep --strict --verbose=2 \
            build/Build/Products/Release/Corta.app
          rm -f "${{ steps.package.outputs.zip }}"
          # Re-packaged with the ticket stapled, and re-checked — this time
          # requiring the Developer ID signature, the staple and
          # Gatekeeper's acceptance.
          swift run --package-path CortaTerminal -c release corta-release-check \
            package build/Build/Products/Release/Corta.app \
            "${{ steps.version.outputs.version }}" . --require-notarized

      # The minimum OS is read from the app, not typed here: a note that
      # said "26.5" while the app said 26.0 is exactly the drift T11 found.
      - name: Write the release notes
        run: |
          sha=$(shasum -a 256 "${{ steps.package.outputs.zip }}" | cut -d' ' -f1)
          minimum=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' \
            build/Build/Products/Release/Corta.app/Contents/Info.plist)
          {
            echo "## Corta ${{ steps.version.outputs.tag }}"
            echo
            echo "See [CHANGELOG.md](https://github.com/noah-qin/Corta/blob/${{ steps.version.outputs.tag }}/CHANGELOG.md) for what changed."
            echo
            echo "Requires macOS $minimum or later."
            echo
            if [ "${{ steps.signing.outputs.available }}" != "true" ]; then
              echo "> [!WARNING]"
              echo "> **This build is not signed or notarised.** macOS will refuse to"
              echo "> open it until you clear the quarantine attribute yourself:"
              echo "> \`xattr -dr com.apple.quarantine /Applications/Corta.app\`."
              echo "> Only do that if you trust this build. Building from source is"
              echo "> the alternative, and is documented in the README."
              echo
            fi
            echo "\`\`\`"
            echo "SHA-256  $sha"
            # Which compiler produced *this* binary. The numbers in
            # docs/PERFORMANCE.md come from the maintainer's machine and
            # its own toolchain, which is deliberately not this one
            # (PERFORMANCE.md §5.2), so "which toolchain built the thing
            # users run" has to be answerable per release rather than
            # inferred from a pin that moves.
            echo "Built with $(xcodebuild -version | tr '\n' ' ' | sed 's/Build version /(/;s/ *$/)/')"
            echo "\`\`\`"
          } > release-notes.md

      # A rehearsal's archive is kept for a week for inspection, never
      # attached to a release.
      - name: Keep the rehearsal's archive
        if: inputs.dry_run
        uses: actions/upload-artifact@v7
        with:
          name: rehearsal-${{ steps.package.outputs.zip }}
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
            release-notes.md
          retention-days: 7

      - name: Open a draft release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --draft \
            --title "Corta ${{ steps.version.outputs.tag }}" \
            --notes-file release-notes.md \
            "${{ steps.package.outputs.zip }}" \
            "${{ steps.package.outputs.zip }}.sha256"

      # Always, including when an earlier step failed: a signing keychain
      # left on the runner outlives the job that needed it. The hosted
      # runner is destroyed either way, which is why this is hygiene rather
      # than a fix, but a workflow that only cleans up on success teaches
      # the wrong habit to whatever runs it next.
      - name: Remove the signing keychain
        if: always() && steps.signing.outputs.available == 'true'
        run: |
          security list-keychains -d user -s login.keychain-db || true
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
