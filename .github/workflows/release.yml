name: Release

# Manually running Release on main prepares a version PR, waits for CI,
# and releases its exact merge commit. Signing, notarisation and checks gate
# publication. The reusable feed workflow runs in this same pipeline;
# GITHUB_TOKEN-created releases do not raise another workflow's event.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Test, sign and notarise only; change no remote state
        type: boolean
        default: false
      bump:
        description: "Version increment (default: patch)"
        type: choice
        options: [patch, minor, major]
        default: patch

# Includes the feed update, so a newer version cannot overtake this one.
# The prepare job reads the latest main when the requested run starts.
concurrency:
  group: corta-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The shipping artifact is the one place the toolchain matters most; see
  # the same pin in `ci.yml`.
  XCODE_PIN: "26.6.0"
  # The team the Developer ID certificate belongs to.
  TEAM_ID: 646VSJ9K5F
  # Same pinned signing tool as appcast.yml; a rehearsal signs the feed
  # against its own archive without publishing either one.
  SPARKLE_VERSION: "2.10.0"
  SPARKLE_TARBALL_SHA256: "c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c"

jobs:
  prepare:
    name: Prepare the version and merge it after CI
    if: >-
      github.repository == 'noah-qin/Corta' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      actions: write
      # report-ci-statuses.sh: the dispatched CI's result, as the PR's checks.
      statuses: write
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      commit: ${{ steps.prepare.outputs.commit }}
      published: ${{ steps.prepare.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Prepare or resume the version PR
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          BUMP: ${{ inputs.bump || 'patch' }}
        run: bash scripts/prepare-release.sh
      - name: Keep the rehearsal source changes
        if: inputs.dry_run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rehearsal-source
          path: rehearsal.patch
          if-no-files-found: error

  release:
    name: Test, sign, notarise and publish
    needs: prepare
    if: needs.prepare.outputs.published != 'true'
    runs-on: macos-26
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0

      # Re-run failed jobs may reuse prepare's old outputs. Probe GitHub
      # again before building, so a publication followed by a lost response
      # is recovered without ever replacing the published signed bytes.
      - name: Check whether this release was already published
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          exists=false
          if [ "$DRY_RUN" != true ] && \
             gh release view "$TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/is-draft"; then
            if [ "$(cat "$RUNNER_TEMP/is-draft")" = false ]; then
              test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$(git rev-parse HEAD)" || {
                echo "::error::$TAG was published from another commit"; exit 1;
              }
              exists=true
            fi
          fi
          if [ "$exists" = false ] && [ "$DRY_RUN" != true ]; then
            python3 - <<'PYTHON'
          import os
          import re
          import subprocess
          version = tuple(map(int, os.environ['TAG'][1:].split('.')))
          tags = subprocess.check_output(['git', 'tag'], text=True).splitlines()
          if any(tuple(map(int, tag[1:].split('.'))) > version
                 for tag in tags if re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag)):
              raise SystemExit('A newer release tag exists; refusing to publish an older release.')
          PYTHON
          fi
          echo "exists=$exists" >> "$GITHUB_OUTPUT"

      - name: Restore the rehearsal source changes
        if: ${{ steps.published.outputs.exists != 'true' && (inputs.dry_run) }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rehearsal-source
          path: ${{ runner.temp }}/rehearsal
      - name: Apply the rehearsal source changes
        if: ${{ steps.published.outputs.exists != 'true' && (inputs.dry_run) }}
        run: git apply "$RUNNER_TEMP/rehearsal/rehearsal.patch"

      - name: Select the pinned Xcode
        if: steps.published.outputs.exists != 'true'
        run: |
          pinned="/Applications/Xcode_${XCODE_PIN}.app"
          if [ ! -d "$pinned" ]; then
            echo "::error::$pinned is not on this runner image."
            echo "Installed: $(ls -d /Applications/Xcode*.app | tr '\n' ' ')"
            echo "A release builds on the pinned toolchain or not at all."
            exit 1
          fi
          sudo xcode-select -s "$pinned"
          xcodebuild -version

      - name: Work out the version
        if: steps.published.outputs.exists != 'true'
        id: version
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # Automatic publication must never fall back to an unsigned build.
      - name: Check the signing configuration
        if: steps.published.outputs.exists != 'true'
        id: signing
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          ASC_KEY: ${{ secrets.ASC_KEY }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          missing=""
          for name in P12 P12_PASSWORD ASC_KEY ASC_KEY_ID ASC_ISSUER_ID SPARKLE_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::The release environment is missing:$missing"
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Run the tests before shipping anything
        if: steps.published.outputs.exists != 'true'
        env:
          # The core suite reads this directly (`swift test` is in-process);
          # the app suite needs the prefix, which xcodebuild strips on the
          # way into the test host.
          CORTA_TEST_TIMEOUT_SCALE: "3"
          TEST_RUNNER_CORTA_TEST_TIMEOUT_SCALE: "3"
        run: |
          swift test --package-path CortaTerminal
          xcodebuild test \
            -project Corta.xcodeproj \
            -scheme Corta \
            -destination 'platform=macOS' \
            -testPlan Unit \
            -resultBundlePath test-results.xcresult \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            -quiet

      # Preserve the evidence on both success and failure.
      - name: Keep the test results
        if: ${{ steps.published.outputs.exists != 'true' && (always()) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xcresult-release-${{ steps.version.outputs.tag }}
          path: test-results.xcresult
          if-no-files-found: warn
          retention-days: 90

      # -quiet above hides the individual #expect failure message (which
      # menu items collided, here) — only the test name survives to the
      # log. Print it from the result bundle so a failure is diagnosable
      # without re-running locally, which has not reproduced this at all
      # (docs/readme-build-step and v0.1.0 both failed
      # MenuShortcutTests.noKeystrokeIsClaimedByTwoMenuItems on this
      # runner; a dozen local attempts across two machines have not).
      - name: Print test failure details
        if: ${{ steps.published.outputs.exists != 'true' && (failure()) }}
        run: |
          # 'Failure Message' is a *child node type* here, not a field on
          # the failing test — confirmed against this schema locally
          # before relying on it in CI (`xcresulttool ... --schema`).
          xcrun xcresulttool get test-results tests \
            --path test-results.xcresult --compact | \
            jq -r '
              def failures($under):
                (if .nodeType == "Failure Message" then "\($under): \(.name)" else empty end),
                ((if .nodeType == "Test Case" then .name else $under end) as $label
                  | (.children // [])[] | failures($label));
              (.testNodes // [])[] | failures(null)'

      - name: Import the signing certificate
        if: ${{ steps.published.outputs.exists != 'true' && (steps.signing.outputs.available == 'true') }}
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          certificate="$RUNNER_TEMP/certificate.p12"
          trap 'rm -f "$certificate"' EXIT
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          (umask 077 && printf '%s' "$P12" | base64 --decode > "$certificate")
          security import "$certificate" -k "$keychain" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain" > /dev/null

      # `xcodebuild build` is a development action: it left the
      # com.apple.security.get-task-allow entitlement on Corta and
      # corta-exec, and re-signed Sparkle.framework's own nested helpers
      # (Autoupdate, Updater.app, the two XPC services) without a secure
      # timestamp — both are things notarization rejects outright, and a
      # plain `build` does not go through the same "prepare for
      # distribution" pipeline `archive` + `-exportArchive` does, which
      # is what actually fixes them rather than working around either
      # symptom by hand.
      #
      # `ARCHS=arm64` on the command line, not only in project.pbxproj:
      # Xcode does not apply a project's ARCHS to Swift package products,
      # so corta-exec came out universal while the app was arm64 (D21). A
      # command-line setting reaches every target. corta-release-check fails a
      # build where either executable carries another slice.
      #
      # The identity is named by its kind and the team rather than stored
      # as a secret: the keychain holds exactly one Developer ID
      # Application certificate, so the name is unambiguous.
      - name: Build (signed)
        if: ${{ steps.published.outputs.exists != 'true' && (steps.signing.outputs.available == 'true') }}
        run: |
          options="$RUNNER_TEMP/ExportOptions.plist"
          trap 'rm -f "$options"' EXIT

          xcodebuild archive \
            -project Corta.xcodeproj \
            -scheme Corta \
            -configuration Release \
            -archivePath build/Corta.xcarchive \
            ARCHS=arm64 \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            ENABLE_HARDENED_RUNTIME=YES \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime" \
            -quiet

          cat > "$options" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Developer ID Application</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath build/Corta.xcarchive \
            -exportPath build/Build/Products/Release \
            -exportOptionsPlist "$options" \
            -quiet

      # Notarise the app first; this ZIP is an Apple submission only and
      # is deleted on every path. Then sign/notarise/staple the final DMG.
      - name: Notarise the app and disk image
        if: ${{ steps.published.outputs.exists != 'true' && steps.signing.outputs.available == 'true' }}
        id: package
        env:
          REHEARSAL: ${{ inputs.dry_run && '--rehearsal' || '' }}
          ASC_KEY: ${{ secrets.ASC_KEY }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          app=build/Build/Products/Release/Corta.app
          key="$RUNNER_TEMP/asc-key.p8"
          temporary_zip="$RUNNER_TEMP/corta-app-notary.zip"
          stage="$RUNNER_TEMP/corta-dmg-stage"
          trap 'rm -f "$key" "$temporary_zip"; rm -rf "$stage"' EXIT
          (umask 077 && printf '%s\n' "$ASC_KEY" > "$key")
          ditto -c -k --keepParent --sequesterRsrc "$app" "$temporary_zip"
          xcrun notarytool submit "$temporary_zip" \
            --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait
          rm -f "$temporary_zip"
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

          mkdir -p "$stage"
          ditto "$app" "$stage/Corta.app"
          ln -s /Applications "$stage/Applications"
          dmg="Corta-$VERSION.dmg"
          # UDZO is a compressed read-only image understood by hdiutil and
          # Sparkle, with no Finder customization or license resources.
          hdiutil create -volname Corta -srcfolder "$stage" -format UDZO "$dmg"
          codesign --force --sign "Developer ID Application" --timestamp "$dmg"
          xcrun notarytool submit "$dmg" \
            --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait
          xcrun stapler staple "$dmg"
          swift run --package-path CortaTerminal -c release corta-release-check \
            package "$app" "$VERSION" . --require-notarized $REHEARSAL
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"

      - name: Rehearse the signed update feed
        if: ${{ steps.published.outputs.exists != 'true' && inputs.dry_run }}
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          ARCHIVE: ${{ steps.package.outputs.dmg }}
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/rehearsal-sparkle"
          feed="$RUNNER_TEMP/rehearsal-feed"
          mkdir -p "$tools" "$feed"
          curl -sSL --fail -o "$tools/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          echo "${SPARKLE_TARBALL_SHA256}  $tools/sparkle.tar.xz" | shasum -a 256 -c -
          tar -xJf "$tools/sparkle.tar.xz" -C "$tools" ./bin/generate_appcast
          cp "$ARCHIVE" "$feed/"
          cp appcast.xml "$feed/appcast.xml"
          printf '%s\n' "$SPARKLE_PRIVATE_KEY" | "$tools/bin/generate_appcast" \
            --ed-key-file - \
            --download-url-prefix "https://github.com/noah-qin/Corta/releases/download/$TAG/" \
            "$feed"
          swift scripts/verify-appcast.swift "$feed/appcast.xml" Sparkle-Info.plist \
            --archive "$ARCHIVE" --version "$VERSION"

      - name: Keep the rehearsal's signed feed
        if: ${{ steps.published.outputs.exists != 'true' && inputs.dry_run }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rehearsal-appcast-${{ steps.version.outputs.tag }}
          path: ${{ runner.temp }}/rehearsal-feed/appcast.xml
          if-no-files-found: error
          retention-days: 7

      # The minimum OS is read from the app, not typed here: a note that
      # said "26.5" while the app said 26.0 is exactly the drift T11 found.
      - name: Write the release notes
        if: steps.published.outputs.exists != 'true'
        run: |
          sha=$(shasum -a 256 "${{ steps.package.outputs.dmg }}" | cut -d' ' -f1)
          minimum=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' \
            build/Build/Products/Release/Corta.app/Contents/Info.plist)
          {
            echo "## Corta ${{ steps.version.outputs.tag }}"
            echo
            python3 scripts/prepare-release.py --notes "${{ steps.version.outputs.version }}"
            echo
            echo "See [CHANGELOG.md](https://github.com/noah-qin/Corta/blob/${{ steps.version.outputs.tag }}/CHANGELOG.md) for the full history."
            echo
            executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' \
              build/Build/Products/Release/Corta.app/Contents/Info.plist)
            architectures=$(lipo -archs "build/Build/Products/Release/Corta.app/Contents/MacOS/$executable")
            case "$architectures" in
              arm64) hardware="a Mac with Apple silicon" ;;
              *) hardware="a Mac supporting $architectures" ;;
            esac
            echo "Requires macOS $minimum or later on $hardware."
            echo
            echo "## Install"
            echo
            echo "Download \`Corta-${{ steps.version.outputs.version }}.dmg\` and its \`.sha256\` file."
            echo '```sh'
            echo "shasum -a 256 -c Corta-${{ steps.version.outputs.version }}.dmg.sha256"
            echo '```'
            echo "Open the disk image, drag Corta into Applications, then eject the disk image."
            echo
            echo "\`\`\`"
            echo "SHA-256  $sha"
            # Which compiler produced *this* binary. The numbers in
            # docs/PERFORMANCE.md come from the maintainer's machine and
            # its own toolchain, which is deliberately not this one
            # (PERFORMANCE.md §5.2), so "which toolchain built the thing
            # users run" has to be answerable per release rather than
            # inferred from a pin that moves.
            echo "Built with $(xcodebuild -version | tr '\n' ' ' | sed 's/Build version /(/;s/ *$/)/')"
            echo "\`\`\`"
          } > release-notes.md

      # A rehearsal's archive is kept for a week for inspection, never
      # attached to a release.
      - name: Keep the rehearsal's archive
        if: ${{ steps.published.outputs.exists != 'true' && (inputs.dry_run) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rehearsal-${{ steps.package.outputs.dmg }}
          path: |
            ${{ steps.package.outputs.dmg }}
            ${{ steps.package.outputs.dmg }}.sha256
          retention-days: 7

      # Create the tag only after the exact commit's archive passed checks.
      # A rerun may find the tag left by a failed upload, never move it.
      - name: Tag and publish the release
        if: ${{ steps.published.outputs.exists != 'true' && (!inputs.dry_run) }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            test "$(git rev-parse "$TAG^{commit}")" = "$commit" || {
              echo "::error::$TAG already names another commit"; exit 1;
            }
          else
            git tag "$TAG" "$commit"
            git push origin "refs/tags/$TAG"
          fi
          if gh release view "$TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/is-draft"; then
            test "$(cat "$RUNNER_TEMP/is-draft")" = true || {
              echo "::error::$TAG is already published; do not replace its signed bytes"; exit 1;
            }
          else
            gh release create "$TAG" --verify-tag --draft \
              --title "Corta $TAG" --notes-file release-notes.md
          fi
          gh release upload "$TAG" \
            "${{ steps.package.outputs.dmg }}" "${{ steps.package.outputs.dmg }}.sha256" --clobber
          gh release edit "$TAG" --draft=false --latest

      # Always, including when an earlier step failed: a signing keychain
      # left on the runner outlives the job that needed it. The hosted
      # runner is destroyed either way, which is why this is hygiene rather
      # than a fix, but a workflow that only cleans up on success teaches
      # the wrong habit to whatever runs it next.
      - name: Remove the signing keychain
        if: ${{ steps.published.outputs.exists != 'true' && (always() && steps.signing.outputs.available == 'true') }}
        run: |
          security list-keychains -d user -s login.keychain-db || true
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  update-feed:
    name: Sign and publish the automatic update
    needs: [prepare, release]
    if: >-
      always() && !cancelled() && !inputs.dry_run &&
      needs.prepare.result == 'success' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped')
    permissions:
      contents: write
      pull-requests: write
      actions: write
      # report-ci-statuses.sh: the dispatched CI's result, as the PR's checks.
      statuses: write
    uses: ./.github/workflows/appcast.yml
    # The called sign job names the release environment, but a reusable
    # workflow sees no secrets its caller does not pass: 1.1.5's feed step
    # found SPARKLE_PRIVATE_KEY empty and stopped after publication.
    secrets: inherit
    with:
      tag: ${{ needs.prepare.outputs.tag }}
