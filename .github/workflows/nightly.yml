name: Nightly

# The lane the PR checks deliberately are not.
#
# `ci.yml` has to be fast and reproducible: one fixed fuzz seed, one test
# run, no sanitizers. That makes it a regression check a reviewer can trust
# and rerun, and a poor way to find anything new. This runs the parts that
# take time or that trade determinism for coverage — a rotating fuzz seed, a
# long mutation run, and the core suite under the thread and address
# sanitizers — on a schedule, where a failure is a bug report rather than a
# blocked pull request.
on:
  schedule:
    - cron: "17 9 * * *"  # 09:17 UTC daily, off the hour to avoid the rush
  workflow_dispatch:
    inputs:
      seed:
        description: "Fuzz seed to use (default: derived from the run number)"
        required: false

permissions:
  contents: read

jobs:
  sanitizers:
    name: Core suite under sanitizers
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [thread, address]
    steps:
      - uses: actions/checkout@v7

      - name: Select the newest installed Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          swift --version

      # The core is where the concurrency is — the write queue, the reader
      # thread, the session teardown — and it is the part that runs without a
      # window server, so it is the part a sanitizer can reach here.
      # Instrumentation costs roughly an order of magnitude, and the suite's
      # wedged-child ceilings are sized for an uninstrumented run. Scaling
      # them here keeps a slow run from being reported as a hang.
      - name: Test
        env:
          CORTA_TEST_TIMEOUT_SCALE: "10"
        run: swift test --package-path CortaTerminal --sanitize=${{ matrix.sanitizer }}

  fuzz:
    name: Long fuzz run on a rotating seed
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Select the newest installed Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest"

      - name: Build
        run: swift build --package-path CortaTerminal -c release --product corta-fuzz

      # A fixed seed stops expanding coverage after its first clean run. The
      # seed is reported in the log and in the artifact name so a failure can
      # be reproduced exactly.
      - name: Fuzz
        id: fuzz
        run: |
          seed="${{ github.event.inputs.seed }}"
          if [ -z "$seed" ]; then seed=$(( ${{ github.run_number }} * 7919 % 100000 )); fi
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "Fuzzing with seed $seed"
          CortaTerminal/.build/release/corta-fuzz --fuzz 20000000 --seed "$seed" \
            CortaTerminal/Tests/Fuzz/corpus

      - name: Keep the corpus and the seed when the fuzzer finds something
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failure-seed-${{ steps.fuzz.outputs.seed }}
          path: |
            CortaTerminal/Tests/Fuzz/corpus
            /tmp/corta-fuzz-*
          if-no-files-found: ignore
          retention-days: 30

  newest-toolchain:
    name: Compatibility with the newest installed Xcode
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # The other half of pinning the required lane: something still has to
      # find out that a newer SDK broke the build, and this is where finding
      # it out is a bug report rather than a blocked pull request.
      - name: Select and record the newest installed Xcode
        id: toolchain
        run: |
          # Bundle versions, not path names: Xcode.app sorts after versioned
          # bundles even when it contains an older compiler.
          latest=$(python3 - <<'PYTHON'
          import glob, plistlib, re
          from pathlib import Path
          candidates = []
          for app in glob.glob('/Applications/Xcode*.app'):
              with open(Path(app) / 'Contents/version.plist', 'rb') as source:
                  info = plistlib.load(source)
              version = tuple(int(n) for n in re.findall(r'\d+', info['CFBundleVersion']))
              candidates.append((version, app))
          print(max(candidates)[1])
          PYTHON
          )
          export DEVELOPER_DIR="$latest/Contents/Developer"
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          # Runner bundle names identify preview installs. Always retain the
          # exact version/build as the authoritative identity.
          channel=unspecified
          case "$latest" in *[Bb]eta*|*[Rr][Cc]*) channel=preview ;; esac
          scripts/record-toolchain.sh "$channel" | tee toolchain.txt
          cat toolchain.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Core build and test
        id: core
        run: swift test --package-path CortaTerminal 2>&1 | tee core-toolchain.log

      - name: App build and test
        id: app
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: |
          xcodebuild test \
            -project Corta.xcodeproj \
            -scheme Corta \
            -destination 'platform=macOS' \
            -skip-testing:CortaUITests \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            -resultBundlePath NewestToolchain.xcresult \
            2>&1 | tee app-toolchain.log

      - name: Summarize compatibility results
        if: always()
        env:
          CORE_RESULT: ${{ steps.core.outcome }}
          APP_RESULT: ${{ steps.app.outcome }}
        run: |
          printf '\nCore: %s\nApp: %s\n' "$CORE_RESULT" "$APP_RESULT" >> "$GITHUB_STEP_SUMMARY"
          # Include deprecations without hiding the full build logs.
          { grep -i 'deprecated' core-toolchain.log app-toolchain.log || true; } > deprecations.txt
          cat deprecations.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Keep toolchain identity, diagnostics and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-newest-toolchain
          path: |
            toolchain.txt
            core-toolchain.log
            app-toolchain.log
            deprecations.txt
            NewestToolchain.xcresult
          if-no-files-found: ignore
          retention-days: 14
