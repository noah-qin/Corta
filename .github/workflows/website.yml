# Website source is in website/; Markdown and assets are read from the repository root.
name: Corta website
on:
  push:
    branches: [main]
    paths:
      - README.md
      - CHANGELOG.md
      - docs/**
      - website/**
      - .github/workflows/website.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: corta-website-pages
  cancel-in-progress: true
jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Accurate per-source lastmod dates.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Read Pages URL configuration
        id: pages
        uses: actions/configure-pages@v5
      - run: bun install --frozen-lockfile
      - name: Build and verify static export
        run: |
          bun run build
          bun run check
          bun run test
          bun run verify
        env:
          WEBSITE_DEPLOYMENT: "1"
          CORTA_CONTENT_DIR: ..
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.origin }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static artifact
        id: deployment
        uses: actions/deploy-pages@v4
