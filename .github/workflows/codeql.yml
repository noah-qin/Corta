name: CodeQL

# CI calls this workflow for PRs, main pushes and bot-created release PRs.
# Keep scheduled scanning: new queries can find problems in unchanged code.
on:
  workflow_call:
    inputs:
      languages:
        description: JSON array of affected languages; standalone scans always cover all languages
        type: string
        default: '["swift","c-cpp","python","actions"]'
  workflow_dispatch:
  schedule:
    - cron: '43 21 * * *'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    # Keep required matrix check names; unaffected languages use Linux.
    # Standalone manual and scheduled scans always analyze the full tree.
    runs-on: ${{ contains(fromJSON(inputs.languages || '["swift","c-cpp","python","actions"]'), matrix.language) && matrix.runner || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            runner: macos-26
            build-mode: manual
          - language: c-cpp
            runner: macos-26
            build-mode: manual
          - language: python
            runner: ubuntu-latest
            build-mode: none
          - language: actions
            runner: ubuntu-latest
            build-mode: none
    env:
      # Keep aligned with ci.yml, nightly.yml, release.yml and render.yml.
      XCODE_PIN: "26.6.0"
    steps:
      - name: Unaffected language
        if: ${{ !contains(fromJSON(inputs.languages || '["swift","c-cpp","python","actions"]'), matrix.language) }}
        run: echo "This language is unaffected by the complete diff; scheduled and manual scans remain full."

      - name: Checkout
        if: ${{ contains(fromJSON(inputs.languages || '["swift","c-cpp","python","actions"]'), matrix.language) }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # C sources are being introduced separately; older refs may have none.
      - name: Report absent C/C++ sources
        if: ${{ contains(fromJSON(inputs.languages || '["swift","c-cpp","python","actions"]'), matrix.language) && (matrix.language == 'c-cpp' && hashFiles('**/*.c', '**/*.cpp', '**/*.cc', '**/*.cxx', '**/*.m', '**/*.mm') == '') }}
        run: echo "No C/C++ sources in this ref; this language has no database to upload."

      - name: Select the pinned Xcode
        if: ${{ contains(fromJSON(inputs.languages || '["swift","c-cpp","python","actions"]'), matrix.language) && (matrix.build-mode == 'manual' && (matrix.language != 'c-cpp' || hashFiles('**/*.c', '**/*.cpp', '**/*.cc', '**/*.cxx', '**/*.m', '**/*.mm') != '')) }}
        run: |
          pinned="/Applications/Xcode_${XCODE_PIN}.app"
          test -d "$pinned" || { echo "::error::$pinned is missing; update the toolchain pins together."; exit 1; }
          echo "DEVELOPER_DIR=$pinned/Contents/Developer" >> "$GITHUB_ENV"

      # Resolve packages before tracing; this does not compile production sources.
      - name: Resolve Swift dependencies before extraction
        if: ${{ contains(fromJSON(inputs.languages || '["swift","c-cpp","python","actions"]'), matrix.language) && matrix.language == 'swift' }}
        run: |
          xcodebuild -resolvePackageDependencies -project Corta.xcodeproj -scheme Corta -derivedDataPath "$RUNNER_TEMP/codeql-app" -onlyUsePackageVersionsFromResolvedFile
          swift package --disable-sandbox --package-path CortaTerminal dump-package > "$RUNNER_TEMP/codeql-package.json"

      - name: Initialize CodeQL
        if: ${{ contains(fromJSON(inputs.languages || '["swift","c-cpp","python","actions"]'), matrix.language) && (matrix.language != 'c-cpp' || hashFiles('**/*.c', '**/*.cpp', '**/*.cc', '**/*.cxx', '**/*.m', '**/*.mm') != '') }}
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      # Extract the C shim independently; compiling the entire Swift app for
      # one C file used to take fourteen minutes. Unknown native layouts fall
      # back to the project build instead of silently omitting new sources.
      - name: Compile native sources for extraction
        if: ${{ contains(fromJSON(inputs.languages || '["swift","c-cpp","python","actions"]'), matrix.language) && matrix.language == 'c-cpp' && hashFiles('**/*.c', '**/*.cpp', '**/*.cc', '**/*.cxx', '**/*.m', '**/*.mm') != '' }}
        run: python3 -B scripts/codeql-extract.py c --derived-data "$RUNNER_TEMP/codeql-native"

      # Fresh products, no compiler caching, one architecture, and a timing
      # summary. CodeQL's tracer cannot resolve the Metal toolchain, so only
      # this extraction build excludes shaders; ordinary app CI compiles them.
      - name: Build the app and embedded helpers for extraction
        if: ${{ contains(fromJSON(inputs.languages || '["swift","c-cpp","python","actions"]'), matrix.language) && matrix.language == 'swift' }}
        run: python3 -B scripts/codeql-extract.py app --derived-data "$RUNNER_TEMP/codeql-app"

      # Reuse the newly extracted Xcode modules, then compile only the tools
      # and libraries absent from its scheme. No cached CodeQL database or
      # stale objects; an unfamiliar package layout falls back to SwiftPM.
      - name: Compile supplemental SwiftPM sources for extraction
        if: ${{ contains(fromJSON(inputs.languages || '["swift","c-cpp","python","actions"]'), matrix.language) && matrix.language == 'swift' }}
        run: python3 -B scripts/codeql-extract.py swift-tools --derived-data "$RUNNER_TEMP/codeql-app"

      - name: Analyze and upload
        if: ${{ contains(fromJSON(inputs.languages || '["swift","c-cpp","python","actions"]'), matrix.language) && (matrix.language != 'c-cpp' || hashFiles('**/*.c', '**/*.cpp', '**/*.cc', '**/*.cxx', '**/*.m', '**/*.mm') != '') }}
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}

      - name: Require complete compiled-source coverage
        if: ${{ contains(fromJSON(inputs.languages || '["swift","c-cpp","python","actions"]'), matrix.language) && (matrix.language == 'swift' || (matrix.language == 'c-cpp' && hashFiles('**/*.c', '**/*.cpp', '**/*.cc', '**/*.cxx', '**/*.m', '**/*.mm') != '')) }}
        env:
          LANGUAGE: ${{ matrix.language }}
        run: |
          if [ "$LANGUAGE" = swift ]; then
            python3 -B scripts/codeql-extract.py verify-swift --derived-data "$RUNNER_TEMP/codeql_databases/swift"
          else
            python3 -B scripts/codeql-extract.py verify-c --derived-data "$RUNNER_TEMP/codeql_databases/cpp"
          fi
