name: CodeQL

# CI calls this workflow for PRs, main pushes and bot-created release PRs.
# Keep scheduled scanning: new queries can find problems in unchanged code.
on:
  workflow_call:
    inputs:
      languages:
        description: JSON array of affected languages; standalone scans always cover all languages
        type: string
        default: '["swift","c-cpp","python","actions"]'
      baselines:
        description: JSON object of main analysis ids a PR uploads for its unaffected languages
        type: string
        default: '{}'
  workflow_dispatch:
  schedule:
    - cron: '43 21 * * *'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    # Keep required matrix check names; unaffected languages use Linux.
    # Standalone manual and scheduled scans always analyze the full tree.
    runs-on: ${{ contains(fromJSON(inputs.languages || '["swift","c-cpp","python","actions"]'), matrix.language) && matrix.runner || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    env:
      # Whether this language's inputs changed: the one question every step asks.
      AFFECTED: ${{ contains(fromJSON(inputs.languages || '["swift","c-cpp","python","actions"]'), matrix.language) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            runner: macos-26
            build-mode: manual
          - language: c-cpp
            runner: macos-26
            build-mode: manual
          - language: python
            runner: ubuntu-latest
            build-mode: none
          - language: actions
            runner: ubuntu-latest
            build-mode: none
    steps:
      - name: Unaffected language
        if: env.AFFECTED != 'true'
        run: echo "This language's analysed inputs are unchanged since main's last analysis; scheduled and manual scans remain full."

      # The scanning rule needs every main configuration on a PR. Unchanged
      # inputs give main's results, so upload that analysis; the classifier
      # selects a language for a fresh scan whenever no such analysis exists.
      - name: Fetch main's analysis for unchanged inputs
        if: env.AFFECTED != 'true' && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          LANGUAGE: ${{ matrix.language }}
          ANALYSIS_ID: ${{ fromJSON(inputs.baselines || '{}')[matrix.language] }}
        run: |
          test -n "$ANALYSIS_ID" || { echo "::error::No main $LANGUAGE analysis to reuse; the classifier should have selected a scan."; exit 1; }
          gh api -H 'Accept: application/sarif+json' "repos/$GITHUB_REPOSITORY/code-scanning/analyses/$ANALYSIS_ID" \
            | jq 'del(.runs[].versionControlProvenance)' > "$RUNNER_TEMP/main-$LANGUAGE.sarif"
          jq -e --arg category "/language:$LANGUAGE/" '.runs | length > 0 and all(.automationDetails.id == $category and .tool.driver.name == "CodeQL")' \
            "$RUNNER_TEMP/main-$LANGUAGE.sarif" > /dev/null || { echo "::error::Analysis $ANALYSIS_ID is not main's CodeQL $LANGUAGE analysis."; exit 1; }

      # Upload resolves the commit and any missing fingerprints from a checkout.
      - name: Checkout for the upload
        if: env.AFFECTED != 'true' && github.event_name != 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Upload main's analysis for unchanged inputs
        if: env.AFFECTED != 'true' && github.event_name != 'push'
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: ${{ runner.temp }}/main-${{ matrix.language }}.sarif
          category: /language:${{ matrix.language }}

      - name: Checkout
        if: env.AFFECTED == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select the pinned Xcode
        if: env.AFFECTED == 'true' && matrix.build-mode == 'manual'
        uses: ./.github/actions/select-xcode
        with:
          scope: job

      # Resolve packages before tracing; this does not compile production sources.
      - name: Resolve Swift dependencies before extraction
        if: env.AFFECTED == 'true' && matrix.language == 'swift'
        run: |
          xcodebuild -resolvePackageDependencies -project Corta.xcodeproj -scheme Corta -derivedDataPath "$RUNNER_TEMP/codeql-app" -onlyUsePackageVersionsFromResolvedFile
          swift package --disable-sandbox --package-path CortaTerminal dump-package > "$RUNNER_TEMP/codeql-package.json"

      - name: Initialize CodeQL
        if: env.AFFECTED == 'true'
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      # Extract the C shim independently; compiling the entire Swift app for
      # one C file used to take fourteen minutes. Unknown native layouts fall
      # back to the project build instead of silently omitting new sources.
      - name: Compile native sources for extraction
        if: env.AFFECTED == 'true' && matrix.language == 'c-cpp'
        run: python3 -B scripts/codeql-extract.py c --derived-data "$RUNNER_TEMP/codeql-native"

      # Fresh products, no compiler caching, one architecture, and a timing
      # summary. CodeQL's tracer cannot resolve the Metal toolchain, so only
      # this extraction build excludes shaders; ordinary app CI compiles them.
      - name: Build the app and embedded helpers for extraction
        if: env.AFFECTED == 'true' && matrix.language == 'swift'
        run: python3 -B scripts/codeql-extract.py app --derived-data "$RUNNER_TEMP/codeql-app"

      # Reuse the newly extracted Xcode modules, then compile only the tools
      # and libraries absent from its scheme. No cached CodeQL database or
      # stale objects; an unfamiliar package layout falls back to SwiftPM.
      - name: Compile supplemental SwiftPM sources for extraction
        if: env.AFFECTED == 'true' && matrix.language == 'swift'
        run: python3 -B scripts/codeql-extract.py swift-tools --derived-data "$RUNNER_TEMP/codeql-app"

      - name: Analyze and upload
        if: env.AFFECTED == 'true'
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}

      - name: Require complete compiled-source coverage
        if: env.AFFECTED == 'true' && matrix.build-mode == 'manual'
        env:
          LANGUAGE: ${{ matrix.language }}
        run: |
          if [ "$LANGUAGE" = swift ]; then
            python3 -B scripts/codeql-extract.py verify-swift --derived-data "$RUNNER_TEMP/codeql_databases/swift"
          else
            python3 -B scripts/codeql-extract.py verify-c --derived-data "$RUNNER_TEMP/codeql_databases/cpp"
          fi
