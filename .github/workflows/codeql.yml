name: CodeQL

# CI calls this workflow for PRs, main pushes and bot-created release PRs.
# Keep scheduled scanning: new queries can find problems in unchanged code.
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '43 21 * * *'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            runner: macos-26
            build-mode: manual
          - language: c-cpp
            runner: macos-26
            build-mode: manual
          - language: python
            runner: ubuntu-latest
            build-mode: none
          - language: actions
            runner: ubuntu-latest
            build-mode: none
    env:
      # Keep aligned with ci.yml, nightly.yml, release.yml and render.yml.
      XCODE_PIN: "26.6.0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # C sources are being introduced separately; older refs may have none.
      - name: Report absent C/C++ sources
        if: matrix.language == 'c-cpp' && hashFiles('**/*.c', '**/*.cpp', '**/*.cc') == ''
        run: echo "No C/C++ sources in this ref; this language has no database to upload."

      - name: Select the pinned Xcode
        if: matrix.build-mode == 'manual' && (matrix.language != 'c-cpp' || hashFiles('**/*.c', '**/*.cpp', '**/*.cc') != '')
        run: |
          pinned="/Applications/Xcode_${XCODE_PIN}.app"
          test -d "$pinned" || { echo "::error::$pinned is missing; update the toolchain pins together."; exit 1; }
          echo "DEVELOPER_DIR=$pinned/Contents/Developer" >> "$GITHUB_ENV"

      - name: Initialize CodeQL
        if: matrix.language != 'c-cpp' || hashFiles('**/*.c', '**/*.cpp', '**/*.cc') != ''
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      # A fresh DerivedData directory and disabled compiler caching prevent
      # an incremental build from producing an incomplete CodeQL database.
      # A generic destination compiles without resolving a runnable host:
      # the CodeQL tracer can make Xcode see an x86_64 host for an arm64 app.
      # CodeQL does not analyze Metal. Its macOS tracer cannot reliably
      # find the Metal toolchain (codeql-action#3978), so only this extraction
      # build excludes shaders; the ordinary app CI still compiles them.
      # No signing identity, release environment or repository secrets.
      - name: Build the app and embedded helpers for extraction
        if: matrix.build-mode == 'manual' && (matrix.language != 'c-cpp' || hashFiles('**/*.c', '**/*.cpp', '**/*.cc') != '')
        run: |
          xcodebuild clean build \
            -project Corta.xcodeproj \
            -scheme Corta \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/codeql-app" \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            EXCLUDED_SOURCE_FILE_NAMES="*.metal" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            COMPILATION_CACHE_ENABLE_CACHING=NO \
            -quiet

      # The Xcode scheme does not build every SwiftPM executable (fuzzer,
      # release checker, license checker, benchmarks); extract them too.
      - name: Build every SwiftPM product for extraction
        if: matrix.language == 'swift'
        run: swift build --package-path CortaTerminal --scratch-path "$RUNNER_TEMP/codeql-core" --disable-build-manifest-caching

      - name: Analyze and upload
        if: matrix.language != 'c-cpp' || hashFiles('**/*.c', '**/*.cpp', '**/*.cc') != ''
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
