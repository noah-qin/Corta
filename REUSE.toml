# The license of every file that does not carry a header of its own
# (https://reuse.software/spec-3.3/). Which files those are is decided by
# `LicenseHeaders.rules` (CortaTerminal/Sources/LicenseHeaders) and
# explained in docs/LICENSING.md; keep the two in step. When several
# annotations match a file, the last one wins.

version = 1

# Documentation, project files, localisation, assets that are not brand
# artwork, and test inputs that must stay byte-for-byte what they are.
[[annotations]]
path = [
  "**/*.md",
  "NOTICE",
  "CortaTerminal/Tests/CortaTerminalTests/Golden/**",
  "CortaTerminal/Tests/Fuzz/**",
  "docs/esctest/**",
  "Corta.xcodeproj/**",
  "Corta/Base.lproj/**",
  "Corta/Assets.xcassets/**",
  "Corta/Localizable.xcstrings",
  "TestPlans/*.xctestplan",
  "Sparkle-Info.plist",
  "appcast.xml",
]
SPDX-FileCopyrightText = "2026 Noah Qin"
SPDX-License-Identifier = "Apache-2.0"

# The name, the mascot and the application icon are not under Apache-2.0
# (NOTICE, "Trademarks and artwork").
[[annotations]]
path = [
  "docs/brand/*.png",
  "docs/brand/*.gif",
  "AppIcon.icon/**",
  "AppIconDev.icon/**",
]
SPDX-FileCopyrightText = "2026 Noah Qin"
SPDX-License-Identifier = "LicenseRef-Corta-Brand"

# Sparkle's own license, shipped inside the app because its terms require
# the notice to accompany the software (Corta/AcknowledgementsView.swift).
[[annotations]]
path = "Corta/Acknowledgements/Sparkle-LICENSE.txt"
SPDX-FileCopyrightText = [
  "2006-2013 Andy Matuschak",
  "2009-2013 Elgato Systems GmbH",
  "2011-2014 Kornel Lesiński",
  "2015-2017 Mayur Pawashe",
  "2014 C.W. Betts",
  "2014 Petroules Corporation",
  "2014 Big Nerd Ranch",
]
SPDX-License-Identifier = "LicenseRef-Sparkle"
